name: Scala CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Check out repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install Nix (with flake support)
      uses: cachix/install-nix-action@v20
      with:
        extra_nix_config: sandbox = true

    - name: Compile and test with disposable PostgreSQL
      # Finish compilation before running network fixtures and limit concurrent
      # Test-tagged tasks to reduce contention between integration suites.
      run: |
        nix develop --no-write-lock-file --command bash scripts/with-test-postgres.sh \
          sbt --batch --supershell=false \
          'set Global / concurrentRestrictions += Tags.limit(Tags.Test, 1)' \
          compile 'Test / compile' test

    - name: Test browser clients and generic performance regression checks
      run: |
        nix develop --no-write-lock-file --command node --test \
          misc/redesign-client-tests.mjs misc/sensitive-client-tests.mjs \
          misc/performance-regression-tests.mjs \
          misc/browser-auth-baseline/*.test.mjs \
          misc/browser-auth-baseline/performance/*.test.mjs

    - name: Validate PostgreSQL wire instrumentation against the physical engine
      run: |
        nix develop --no-write-lock-file --command bash scripts/with-test-postgres.sh \
          node --test misc/browser-auth-baseline/performance/postgres-wire-proxy.pg-tests.mjs

  native-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Install Nix (with flake support)
      uses: cachix/install-nix-action@v20
      with:
        extra_nix_config: sandbox = true

    - name: Test native Chromium and WebKit
      run: nix develop .#browser --no-write-lock-file --command bash scripts/test-native-browsers.sh

    - name: Validate profiling capabilities and owned-process measurements
      run: |
        nix develop .#profiling --no-write-lock-file --command node --test \
          misc/browser-auth-baseline/performance/native-memory.linux-tests.mjs \
          misc/browser-auth-baseline/performance/browser-heap.native-tests.mjs \
          misc/browser-auth-baseline/performance/chromium-allocation.native-tests.mjs

    - name: Test the Scala browser authentication reference
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          bash scripts/test-browser-auth-baseline.sh

    - name: Test the JDBC Scala browser authentication reference
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          bash scripts/with-test-postgres.sh env SPOONBILL_AUTH_BASELINE_PROVIDER=jdbc \
          bash scripts/test-browser-auth-baseline.sh
