name: Scala CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      performance_tooling:
        description: Run optional performance tooling and profiling checks
        type: boolean
        required: false
        default: false

jobs:
  build:

    runs-on: ubuntu-latest
    # The cold full-repository build hit the previous 30-minute job cap.
    # Keep a finite bound for the cold correctness build.
    timeout-minutes: 45

    steps:
    - name: Check out repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install Nix (with flake support)
      uses: cachix/install-nix-action@v20
      with:
        extra_nix_config: sandbox = true

    - name: Compile and test with disposable PostgreSQL
      # Finish compilation before running network fixtures and limit concurrent
      # Test-tagged tasks to reduce contention between integration suites.
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command bash scripts/with-test-postgres.sh \
          sbt --batch --supershell=false -Dsbt.server.autostart=false \
          'set Global / concurrentRestrictions += Tags.limit(Tags.Test, 1)' \
          compile 'Test / compile' test

    - name: Test browser clients and reference correctness
      run: |
        nix develop --no-write-lock-file --command node --test \
          misc/redesign-client-tests.mjs misc/sensitive-client-tests.mjs \
          misc/browser-protocol-tests.mjs \
          misc/browser-auth-schema-tests.mjs \
          misc/replacement-bootstrap-tests.mjs \
          misc/core-purity-tests.mjs \
          misc/browser-auth-baseline/*.test.mjs

    - name: Verify the pure core boundary
      run: nix develop --no-write-lock-file --command node scripts/check-core-purity.mjs

    - name: Verify explicit PostgreSQL migration matches the provider schema
      run: nix develop --no-write-lock-file --command node scripts/export-browser-auth-schema.mjs --check

    - name: Verify published native Scala 3 Pekko dependencies
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          sbt --batch --supershell=false -Dsbt.server.autostart=false \
          'core/publishLocal' 'bytes/publishLocal' 'effect/publishLocal' \
          'http/publishLocal' 'web/publishLocal' 'webDsl/publishLocal' \
          'spoonbill/publishLocal' 'pekko/publishLocal' 'pekko/makePom'
        nix develop --no-write-lock-file --command node misc/pekko-native-consumer/check-pom.mjs \
          interop/pekko/target/scala-3.3.8/spoonbill-pekko_3-5.0.0-SNAPSHOT.pom
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          bash -c 'cd misc/pekko-native-consumer && sbt --batch --supershell=false -Dsbt.server.autostart=false verifyNativeGraph compile run'

    - name: Test optional performance tooling
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_tooling }}
      run: |
        nix develop --no-write-lock-file --command node --test \
          misc/performance-regression-tests.mjs \
          misc/browser-auth-baseline/performance/*.test.mjs \
          misc/browser-auth-baseline/performance/jsc-prototype/*.test.mjs

    - name: Validate PostgreSQL wire instrumentation against the physical engine
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_tooling }}
      run: |
        nix develop --no-write-lock-file --command bash scripts/with-test-postgres.sh \
          node --test misc/browser-auth-baseline/performance/postgres-wire-proxy.pg-tests.mjs

    - name: Capture the validated browser authentication runtime
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_tooling }}
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          bash scripts/capture-browser-auth-artifact.sh "$RUNNER_TEMP/spoonbill-auth-runtime"
        nix develop --no-write-lock-file --command node \
          misc/browser-auth-baseline/performance/artifact.mjs archive \
          "$RUNNER_TEMP/spoonbill-auth-runtime" "$RUNNER_TEMP/spoonbill-auth-runtime.tar" \
          > "$RUNNER_TEMP/spoonbill-auth-runtime.tar.json"

    - name: Retain the immutable reference runtime
      id: reference-artifact
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_tooling }}
      uses: actions/upload-artifact@v4
      with:
        name: browser-auth-reference-${{ github.sha }}
        # Preserve empty directories and case-distinct paths inside one file.
        path: ${{ runner.temp }}/spoonbill-auth-runtime.tar
        if-no-files-found: error
        retention-days: 90

    - name: Link the artifact and its content identities
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_tooling }}
      env:
        REFERENCE_ARTIFACT_URL: ${{ steps.reference-artifact.outputs.artifact-url }}
        REFERENCE_ARCHIVE_SHA256: ${{ steps.reference-artifact.outputs.artifact-digest }}
      run: |
        nix develop --no-write-lock-file --command node --input-type=module <<'NODE'
        import {readFileSync, appendFileSync} from 'node:fs';
        const artifact = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/spoonbill-auth-runtime/artifact.json'));
        const archive = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/spoonbill-auth-runtime.tar.json'));
        if (archive.artifactSha256 !== artifact.artifactSha256) throw new Error('Archive/runtime identity mismatch');
        appendFileSync(process.env.GITHUB_STEP_SUMMARY,
          `[Reference runtime](${process.env.REFERENCE_ARTIFACT_URL}) (90-day retention)\n\n` +
          `Build revision: ${process.env.GITHUB_SHA}\n\n` +
          `Runtime content SHA-256: ${artifact.artifactSha256}\n\n` +
          `Reference source SHA-256: ${artifact.referenceIntegrationSha256}\n\n` +
          `Ordered runtime graph SHA-256: ${artifact.dependencyGraphSha256}\n\n` +
          `Runtime tar SHA-256: ${archive.tarSha256}\n\n` +
          `Uploaded archive SHA-256: ${process.env.REFERENCE_ARCHIVE_SHA256}\n`);
        NODE

  native-browser:
    runs-on: ubuntu-latest
    # Includes cold compilation of the public example plus both provider suites.
    timeout-minutes: 45

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Install Nix (with flake support)
      uses: cachix/install-nix-action@v20
      with:
        extra_nix_config: sandbox = true

    - name: Test native Chromium and WebKit
      run: nix develop .#browser --no-write-lock-file --command bash scripts/test-native-browsers.sh

    - name: Validate profiling capabilities and owned-process measurements
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_tooling }}
      run: |
        nix develop .#profiling --no-write-lock-file --command node --test \
          misc/browser-auth-baseline/performance/native-memory.linux-tests.mjs \
          misc/browser-auth-baseline/performance/browser-heap.native-tests.mjs \
          misc/browser-auth-baseline/performance/chromium-allocation.native-tests.mjs \
          misc/browser-auth-baseline/performance/websocket-events.native-tests.mjs \
          misc/browser-auth-baseline/performance/webkit-network-probe.native-tests.mjs \
          misc/browser-auth-baseline/performance/webkit-network-observer.native-tests.mjs

    - name: Test the Scala browser authentication reference
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          bash scripts/test-browser-auth-baseline.sh

    - name: Test the JDBC Scala browser authentication reference
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          bash scripts/with-test-postgres.sh env SPOONBILL_AUTH_BASELINE_PROVIDER=jdbc \
          bash scripts/test-browser-auth-baseline.sh

    - name: Test the public memory browser authentication example
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          bash scripts/test-browser-auth.sh

    - name: Test the public native IO browser authentication example
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          env SPOONBILL_AUTH_PROVIDER=io bash scripts/test-browser-auth.sh

    - name: Test browser authentication served by ZIO HTTP
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          bash scripts/test-zio-http-browser-auth.sh

    - name: Test the public JDBC browser authentication example
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          bash scripts/with-test-postgres.sh env SPOONBILL_AUTH_PROVIDER=jdbc \
          bash scripts/test-browser-auth.sh

    - name: Test clustered browser authentication with overlapping JVMs
      run: |
        env -u JAVA_HOME SBT_NATIVE_CLIENT=false nix develop --no-write-lock-file --command \
          bash scripts/test-clustered-browser-auth.sh
