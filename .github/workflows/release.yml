name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example, 2.0.0)"
        required: true
      branch:
        description: "The branch to release from"
        required: true
        default: "main"
  release:
    types: [published]

jobs:
  scala-3:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}

      - name: Check out repository for release
        if: github.event_name == 'release'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Determine release version
        id: set_version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="${RELEASE_TAG#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected MAJOR.MINOR.PATCH with an optional prerelease suffix" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Nix (with flake support)
        uses: cachix/install-nix-action@v20
        with:
          extra_nix_config: sandbox = true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v3
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PGP_PASSPHRASE }}

      - name: Publish Signed Artifacts
        env:
          RELEASE_VERSION: ${{ steps.set_version.outputs.version }}
          # Release credentials (Sonatype Central / OSSRH Staging API Service).
          SONATYPE_CENTRAL_USERNAME: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          SONATYPE_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          SONATYPE_STAGING_USERNAME: ${{ secrets.SONATYPE_STAGING_USERNAME }}
          SONATYPE_STAGING_PASSWORD: ${{ secrets.SONATYPE_STAGING_PASSWORD }}
        # publishes for Scala 3.
        run: nix develop --no-write-lock-file --command sbt --batch --supershell=false publishSigned

      - name: Sonatype Central Release
        env:
          RELEASE_VERSION: ${{ steps.set_version.outputs.version }}
          # Release credentials (Sonatype Central / OSSRH Staging API Service).
          SONATYPE_CENTRAL_USERNAME: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          SONATYPE_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          SONATYPE_STAGING_USERNAME: ${{ secrets.SONATYPE_STAGING_USERNAME }}
          SONATYPE_STAGING_PASSWORD: ${{ secrets.SONATYPE_STAGING_PASSWORD }}
        run: nix develop --no-write-lock-file --command sbt --batch --supershell=false sonatypeCentralRelease
